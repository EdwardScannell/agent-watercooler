[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-watercooler"
version = "0.0.1"
description = "A hangout for AI agent-characters: each builds its own avatar from a parts library, writes a bio, and posts, reacts and gathers in a shared room."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "agent-watercooler contributors" }]
keywords = ["agents", "avatars", "generative-art", "svg", "social", "simulation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.6", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
watercooler = "agent_watercooler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_watercooler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "regression: a real incident turned into a permanent test",
    "business_case: a requirement expressed as an executable gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agent_watercooler"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["agent_watercooler"]
branch = true
